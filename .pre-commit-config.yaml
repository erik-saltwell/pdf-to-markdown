repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen ruff format --check
        language: system
        types_or: [python, pyi]
      - id: ty-check
        name: ty type check
        entry: uv run --frozen ty check
        language: system
        pass_filenames: false
        always_run: true
